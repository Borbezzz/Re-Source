# Databricks App entrypoint for app "resource" (see deploy/databricks/README.md).
# Source root = repository root. Apps provide DATABRICKS_HOST/CLIENT_ID/CLIENT_SECRET for the app service principal.
command: ["uvicorn", "recovery.api.app:app", "--app-dir", "backend", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: RS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LINKUP_API_KEY
    valueFrom: linkup-key
  - name: COMPANIES_HOUSE_API_KEY
    valueFrom: companies-house-key
  - name: OPENAI_API_KEY
    valueFrom: openai-key          # secret resource openai-key → scope "resource", key openai_key
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: agent-traces
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: DATABRICKS_CATALOG
    value: workspace
  - name: DATABRICKS_SCHEMA
    value: resource
  - name: OPENAI_MODEL
    value: gpt-5.4-mini
  - name: RS_USE_LAKEBASE
    value: "true"                  # operational store on Lakebase (database resource "lakebase" injects PGHOST/PGUSER/...)
  - name: RS_LAKEBASE_INSTANCE
    value: resource-ops
  - name: RS_VAR_DIR
    value: /tmp/resource-var       # only the LangGraph checkpoint file lives here (ephemeral); operational state is in Lakebase
  - name: MLFLOW_DISABLE_AGENT_HINT
    value: "1"
  - name: RS_PACING_MS
    value: "300"
