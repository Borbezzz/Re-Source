<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReSource — Mechanica package inspection</title>
<style>body{margin:0;background:#151515;color:#eee;font:15px system-ui}header{position:absolute;z-index:2;top:20px;left:24px;right:24px;pointer-events:none}h1{font-size:20px;font-weight:500;margin:0 0 8px}p{color:#bbb;margin:5px 0;max-width:800px}nav{position:absolute;z-index:3;left:24px;bottom:24px;display:flex;gap:8px;flex-wrap:wrap;max-width:95vw}button{font:inherit;background:#242424;border:1px solid #666;color:#eee;padding:10px 14px;border-radius:5px;cursor:pointer}button:focus-visible{outline:2px solid #a5dece}#status{position:absolute;right:24px;bottom:85px;max-width:340px;background:#191919;padding:12px;border:1px solid #444}canvas{display:block;width:100vw;height:100vh}</style>
<header><h1>Prepared Mechanica turbofan</h1><p>Package inspection tool — not the final website. Drag to orbit; scroll to zoom.</p><p>Fictional demo identities and requirements · physical scale unvalidated · no manufacturing CAD</p></header>
<nav><button id="fuel">Fuel injector</button><button id="blade">Fan blade</button><button id="nozzle">Core nozzle</button><button id="engine">Show engine</button><button id="explode">Explode</button><button id="assemble">Reassemble</button><button id="casing">Show casing</button></nav>
<div id="status" role="status">Loading package…</div>
<script type="importmap">{"imports":{"three":"./tools/node_modules/three/build/three.module.js","three/addons/":"./tools/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const status=document.querySelector('#status');
try{
const scene=new T.Scene();scene.background=new T.Color('#151515');
const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.001,500);camera.position.set(-10,6,13);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new T.HemisphereLight(0xddeeff,0x555555,3));
for(const [pos,power] of [[[0,10,10],5],[[-8,2,-6],4],[[8,2,0],3]]){const light=new T.DirectionalLight(0xffffff,power);light.position.set(...pos);scene.add(light);}
const manifest=await fetch('./input-package/manifest.json').then(r=>{if(!r.ok)throw new Error('Manifest unavailable');return r.json();});
const gltf=await new GLTFLoader().loadAsync('./input-package/assembly.glb');const model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);
const home=new Map();const colour=new Map();model.traverse(o=>{home.set(o.uuid,o.position.clone());if(o.isMesh){colour.set(o.uuid,o.material.color.clone());o.material.emissive.setHex(0);}});
const byStableId=new Map();model.traverse(o=>{if(o.userData.stableId)byStableId.set(o.userData.stableId,o);});
const groups=['fan','compressor','combustor','turbine','nozzle','casing','shaft'].map(id=>byStableId.get('rs-mech-tf-v1.group.'+id));
if(groups.some(g=>!g))throw new Error('Assembly groups missing');
const casing=groups[5];casing.visible=false;
const cases=manifest.components;let showCasing=false;
function fit(object){const b=new T.Box3().setFromObject(object);const size=b.getSize(new T.Vector3()),centre=b.getCenter(new T.Vector3());const distance=Math.max(size.x,size.y,size.z)*1.9;controls.target.copy(centre);camera.position.copy(centre).add(new T.Vector3(-.9,.6,1.3).normalize().multiplyScalar(Math.max(.4,distance)));controls.update();}
function reset(){for(const g of groups){g.visible=g!==casing||showCasing;g.position.copy(home.get(g.uuid));}model.traverse(o=>{if(o.isMesh){o.visible=true;o.material.emissive.setHex(0);}});model.updateMatrixWorld(true);}
function select(component){reset();const nodes=component.nodeIds.map(id=>byStableId.get(id));if(nodes.some(n=>!n))throw new Error('Component node missing');const keep=new Set();for(const node of nodes)node.traverse(o=>keep.add(o));model.traverse(o=>{if(o.isMesh){o.visible=keep.has(o);if(o.visible){o.material.emissive.setHex(0x2f6255);o.material.emissiveIntensity=.3;}}});const bounds=new T.Box3();for(const node of nodes)bounds.union(new T.Box3().setFromObject(node));const c=bounds.getCenter(new T.Vector3()),s=bounds.getSize(new T.Vector3());controls.target.copy(c);camera.position.copy(c).add(new T.Vector3(-.9,.6,1.3).normalize().multiplyScalar(Math.max(.4,Math.max(s.x,s.y,s.z)*2.8)));controls.update();status.textContent=component.name+' — '+component.componentId+' · '+component.partNumber+' Rev '+component.revision+' · mapped selection verified';window.__lastSelectedComponent=component.componentId;}
document.querySelector('#fuel').onclick=()=>select(cases[0]);document.querySelector('#blade').onclick=()=>select(cases[1]);document.querySelector('#nozzle').onclick=()=>select(cases[2]);
document.querySelector('#engine').onclick=()=>{reset();fit(model);status.textContent='Full engine · casing '+(showCasing?'shown':'hidden');};
document.querySelector('#explode').onclick=()=>{reset();const offsets=[[-3,0,0],[-1.5,0,0],[1,0,0],[2.5,0,0],[4,0,0],[0,4,0],[0,-3,0]];groups.forEach((g,i)=>g.position.add(new T.Vector3(...offsets[i])));model.updateMatrixWorld(true);fit(model);status.textContent='Exploded by assembly group · original home transforms retained';};
document.querySelector('#assemble').onclick=()=>{reset();fit(model);status.textContent='Reassembled · original home transforms restored';};
document.querySelector('#casing').onclick=()=>{showCasing=!showCasing;reset();fit(model);document.querySelector('#casing').textContent=showCasing?'Hide casing':'Show casing';status.textContent='Full engine · casing '+(showCasing?'shown':'hidden');};
const ray=new T.Raycaster(),pointer=new T.Vector2();let down=[0,0];renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);for(const hit of ray.intersectObject(model,true)){let visible=true;for(let p=hit.object;p;p=p.parent)if(!p.visible)visible=false;if(!visible)continue;let componentId=null;for(let p=hit.object;p;p=p.parent)if(p.userData.componentId){componentId=p.userData.componentId;break;}if(componentId){select(cases.find(c=>c.componentId===componentId));return;}status.textContent='Geometry: '+(hit.object.userData.displayName||hit.object.name)+' · no sourcing case assigned';return;}});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
fit(model);status.textContent='Loaded: '+manifest.geometry.independentPieces+' independent pieces · 3 mapped sourcing cases';window.__packageLoaded=true;
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
}catch(e){status.textContent='PACKAGE LOAD FAILED: '+e.message;console.error(e);}
</script></html>
