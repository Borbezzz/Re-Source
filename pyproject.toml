[project]
name = "resource-vercel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "openai>=1.60",
  "mlflow-skinny>=3.1",
  "databricks-sql-connector>=4.0",
  "databricks-sdk>=0.50",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "ortools>=9.10",
  "psycopg[binary]>=3.2",
  "vercel-queue[typed]>=0.11.0",
  "langgraph-checkpoint-postgres>=3.2.1",
  "psycopg-pool>=3.3.3",
  "python-multipart>=0.0.33",
  "pypdf>=6.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"

[[tool.vercel.subscribers]]
entrypoint = "queue_worker"
