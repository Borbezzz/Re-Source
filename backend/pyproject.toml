[project]
name = "resource-recovery"
version = "0.1.0"
description = "Re-Source aerospace recovery backend: FastAPI BFF, LangGraph investigation, Databricks adapters."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "openai>=1.60",
  "mlflow-skinny>=3.1",
  "databricks-sql-connector>=4.0",
  "databricks-sdk>=0.50",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "ortools>=9.10",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
